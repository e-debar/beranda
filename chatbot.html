<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat Bot - E-DEBAR</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root{--primary:#4CAF50;--bg:#7dffb7;--shadow:0 10px 20px rgba(0,0,0,.08)}
    html,body{margin:0;padding:0;font-family:'Roboto',sans-serif;background:var(--bg);display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
    .card{background:#fff;border-radius:24px;box-shadow:var(--shadow);padding:40px 60px;text-align:center;max-width:420px;width:90%;animation:pop .6s cubic-bezier(.34,1.56,.64,1)}
    .avatar{width:160px;height:160px;border-radius:50%;margin:0 auto 24px;overflow:hidden;position:relative}
    .avatar img{width:100%;height:100%;object-fit:cover}
    h1{margin:0 0 20px;font-size:1.75rem;font-weight:700;color:#222;min-height:2.2em}
    /* solid CTA button */
    .cta-btn{display:inline-block;margin-top:6px;padding:10px 22px;background:var(--primary);border:none;border-radius:10px;color:#fff;font-weight:700;font-size:.95rem;text-decoration:none;cursor:pointer}
    .avatar::before{content:"";position:absolute;top:0;left:0;width:100%;height:100%;border-radius:50%;box-shadow:0 0 0 0 var(--primary);animation:pulse 2.5s infinite}
    @keyframes pulse{0%{transform:scale(.9);opacity:.7}70%{transform:scale(1.3);opacity:0}100%{opacity:0}}
    @keyframes pop{0%{transform:scale(.7) translateY(40px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">
      <img src="LOGO E-DEBR.png" alt="Foto Nira" />
    </div>
    <h1 id="greeting"></h1>
    <a class="cta-btn" href="https://share.chatling.ai/s/7rnSzZuRPRWU66P" target="_blank" rel="noopener">Yuk, Tanya E-DEBAR!</a>
  </div>

  <audio id="typingSound" src="https://assets.mixkit.co/sfx/preview/mixkit-typewriter-soft-clicks-1126.mp3"></audio>

  <script>
    const greetingText="Hai Pengguna! Selamat datang di Website E-DEBAR! Ada yang bisa saya bantu?";
    function typeGreeting(t){const g=document.getElementById('greeting');const s=document.getElementById('typingSound');g.textContent="";let i=0;(function type(){if(i<t.length){g.textContent+=t.charAt(i);s.currentTime=0;s.play();i++;setTimeout(type,60);}})();}
    typeGreeting(greetingText);
  </script>
</body>
</html>
